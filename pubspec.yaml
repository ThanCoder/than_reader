name: than_reader
description: "PDF Reader App Material UI."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
repository: https://github.com/ThanCoder/than_reader.git

version: 2.0.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dart_core_extensions: ^0.5.0
  t_widgets:
    path: /home/thancoder/projects/dart_plugins/t_widgets
  mime: ^2.0.0
  t_pdf_reader:
    path: /home/thancoder/projects/dart_plugins/t_pdf_reader
  t_server:
    path: /home/thancoder/projects/dart_plugins/t_server
  cfb_store: ^0.7.0
  crypto: ^3.0.7
  archive: ^4.0.9
  flutter_html: ^3.0.0
  desktop_drop: ^0.7.1
  flutter_svg: ^2.3.0
  html: ^0.15.6
  than_pkg_linux: ^0.2.0
  than_pkg_android: ^0.6.1
  linux_sys_ffi: ^0.1.0
  t_client: ^0.3.0
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: ^1.5.0
  # dart run change_app_package_name:main [com.new.package.name]
  # dart run change_app_package_name:main than.app.novl3.v5
  flutter_launcher_icons: ^0.14.4
  # dart run flutter_launcher_icons
  flutter_lints: ^6.0.0

# dev lib
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/app-icon-3.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/svg/
    - assets/fonts/

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Winnwa
      fonts:
        - asset: assets/fonts/WINNWA.TTF
        
    - family: Zawgyi-One-V3.1
      fonts:
        - asset: assets/fonts/ZAWGYI-ONE_V3.1.TTF

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
